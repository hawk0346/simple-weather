# ---- Starship configuration for simple-weather dev container ----

# プロンプト全体
format = """
$directory\
$git_branch\
$git_status\
$bun\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# 右プロンプト
right_format = "$time"

# 不要モジュールの無効化（起動速度向上）
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[java]
disabled = true
[php]
disabled = true
[ruby]
disabled = true

# ---- 各モジュール設定 ----

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 🔒"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[bun]
format = "[$symbol($version)]($style) "
symbol = "🍞 "
style = "bold yellow"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "
style = "bold green"
detect_files = ["package.json"]
detect_extensions = []

[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "bold blue"
only_with_files = true

[cmd_duration]
min_time = 2_000
format = "[⏱ $duration]($style) "
style = "bold yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "dimmed white"
time_format = "%H:%M"
